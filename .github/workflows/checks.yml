name: Research checks (not proof verification)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  julia-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12.7'
      - name: Run finite checks
        run: julia --startup-file=no --history-file=no --project=. run_checks.jl
